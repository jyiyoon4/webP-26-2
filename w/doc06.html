<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      ol li {
        list-style-type: lower-alpha;
      }

      ol {
        list-style-position: inside;
      }

      ul {
        list-style-position: outside;
        li {
          &.bb {
            list-style-image: url('gif');
          }
        }
      }

      li.aa {
        list-style-type: square;
      }

      #book {
        width: 90%;
        min-width: 600px;
        border-spacing: 0;
      }

      p {
        background-color: cornflowerblue;
        &:hover {
          background-color: lavenderblush;
          transition: background-color 5s;
        }
      }

      ul {
        background-color: rosybrown;
      }

      ol {
        background-color: gray;
      }
    </style>
  </head>
  <body>
    <p>순서 없</p>
    <ul>
      <li class="aa">첫번째</li>
      <li class="aa">두번째</li>
      <li class="bb">세번째</li>
    </ul>

    <ol>
      <p>순서 있</p>
      <li>1번</li>
      <li>2번</li>
      <li>3번</li>
    </ol>

    <p>o.o</p>
    <table border="1" id="book">
      <tr>
        <th>과목</th>
        <th>책제목</th>
        <th>저자</th>
        <th>출판사</th>
      </tr>
      <tr>
        <td rowspan="2">웹프로그래밍</td>
        <td>HTML5</td>
        <td>임순범</td>
        <td>생능</td>
      </tr>
      <tr>
        <td>소셜미디어</td>
        <td>최윤철</td>
        <td>생능</td>
      </tr>
      <tr>
        <th>합계</th>
        <td colspan="3">2권</td>
      </tr>
    </table>
  </body>
</html>
